# Railway service config for the Switchboard API.
# Used when this directory is set as the service root in the Railway UI.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Restart on failure but stop crash-looping after 3 fast restarts.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Railway sets PORT at runtime; the Dockerfile's CMD reads ${PORT:-8000}.
# Health endpoint already exists and is unauthenticated.
healthcheckPath = "/health"
healthcheckTimeout = 30
